name: build
on:
  push:
    tags: ['v*']
    branches: ['main', 'claude/headless-softether-client-s13nn0']
    paths-ignore: ['bin/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false   # the Go module is cloned inside the build; there is no go.sum at the repo root
      - run: sudo apt-get install -y zip nsis
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v6
        with: { name: dist, path: dist/* }
      - name: Commit binaries to the repo (bin/)
        if: github.ref_type == 'branch'
        run: |
          rm -rf bin && mkdir bin && cp dist/* bin/
          (cd bin && sha256sum * > SHA256SUMS)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin
          git commit -m "build: update binaries from ${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with: { files: dist/* }
